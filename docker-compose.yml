services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: collab_docs
      MYSQL_USER: collab
      MYSQL_PASSWORD: collab123
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://collab:collab123@mysql:3306/collab_docs?charset=utf8mb4
      JWT_SECRET: change-me-to-a-long-random-secret
      FILE_ROOT: /app/data/files
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-}
      ONLYOFFICE_SECRET: onlyoffice-shared-secret
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    volumes:
      - file_data:/app/data/files
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  # OnlyOffice 文档服务（协同编辑引擎，按需启用；未配置时前端自动降级）
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: "false"
    volumes:
      - oo_data:/var/www/onlyoffice/Data
    ports:
      - "8888:80"

volumes:
  mysql_data:
  file_data:
  oo_data:
